/**
 * SourceMod Admin Configuration
 *
 * Add your server administrators here.
 * Find your SteamID at: https://steamid.io/
 *
 * Available properties:
 *   "auth"      - REQUIRED - Auth method: "steam", "name", or "ip"
 *   "identity"  - REQUIRED - SteamID, name, or IP address
 *   "password"  - Optional password requirement
 *   "group"     - Adds user to a group (see admin_groups.cfg)
 *   "flags"     - Permission flags (see below)
 *   "immunity"  - Immunity level (higher = cannot be targeted by lower)
 *
 * Permission Flags:
 *   a - Reserved slot
 *   b - Kick players
 *   c - Ban players
 *   d - Unban players
 *   e - Slap/Slay players
 *   f - Change map
 *   g - Change cvars
 *   h - Execute configs
 *   i - Chat commands
 *   j - Special admin chat
 *   k - Start votes
 *   l - Set passwords
 *   m - RCON access
 *   n - Enable cheats
 *   o - Custom flag 1
 *   p - Custom flag 2
 *   q - Custom flag 3
 *   r - Custom flag 4
 *   s - Custom flag 5
 *   t - Custom flag 6
 *   z - Root access (all permissions)
 */
Admins
{
	/**
	 * EXAMPLE: Uncomment and modify with your SteamID
	 *
	"YourName"
	{
		"auth"		"steam"
		"identity"	"STEAM_0:1:12345678"
		"flags"		"z"
		"immunity"	"99"
	}
	 */
}
