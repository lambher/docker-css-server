/**
 * SourceMod Database Configuration
 *
 * SECURITY WARNING:
 * - Never use root user for production
 * - Always set strong passwords
 * - Restrict database access to localhost only
 * - Consider using SQLite for simple setups (no external DB needed)
 */
"Databases"
{
	// Default driver: "sqlite" is recommended for simple setups
	// Change to "mysql" if you need external database
	"driver_default"		"sqlite"

	/**
	 * Default connection - used by most plugins
	 * Using SQLite by default (no setup required)
	 */
	"default"
	{
		"driver"			"sqlite"
		"database"			"sourcemod-local"
	}

	/**
	 * MySQL Example (uncomment and configure if needed)
	 * IMPORTANT: Use a dedicated user, NOT root!
	 *
	"default_mysql"
	{
		"driver"			"mysql"
		"host"				"localhost"
		"database"			"sourcemod"
		"user"				"sourcemod_user"
		"pass"				"CHANGE_THIS_PASSWORD"
		"port"				"3306"
	}
	 */

	// Local storage for SourceMod data
	"storage-local"
	{
		"driver"			"sqlite"
		"database"			"sourcemod-local"
	}

	// Client preferences storage
	"clientprefs"
	{
		"driver"			"sqlite"
		"database"			"clientprefs-sqlite"
	}
}
